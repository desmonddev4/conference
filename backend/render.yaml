services:
  - type: web
    name: gather-registration-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_admin && gunicorn conference_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "gather-registration-api.onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://conference-frontend-two.vercel.app"
      - key: ADMIN_USERNAME
        value: "damedzie4"
      - key: ADMIN_EMAIL
        value: "damedzie4@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gather-registration-db
          property: connectionString
databases:
  - name: gather-registration-db
    plan: 0.1c-256mb
    databaseName: gather_registrations
    user: gather_registrations
